---
- name: Deploy Flask application to Kubernetes
  hosts: vm1
  gather_facts: false

  tasks:
    - name: Copy Kubernetes manifests to VM1
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/{{ item }}"
        dest: "/tmp/{{ item }}"
      loop:
        - configmap.yaml
        - deployment.yaml
        - service.yaml

    - name: Apply ConfigMap
      ansible.builtin.command:
        cmd: kubectl apply -f /tmp/configmap.yaml

    - name: Apply Deployment
      ansible.builtin.command:
        cmd: kubectl apply -f /tmp/deployment.yaml

    - name: Apply Service
      ansible.builtin.command:
        cmd: kubectl apply -f /tmp/service.yaml
