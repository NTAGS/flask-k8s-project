
---
- name: Build and deploy approved Flask application
  hosts: vm1
  gather_facts: false

  vars:
    source_repo: "https://github.com/NTAGS/flask-k8s-project.git"
    app_source_dir: "/tmp/flask-app-cicd"
    docker_auth_dir: "/run/flask-buildkit-auth"
    buildkit_socket: "unix:///run/buildkit/buildkitd.sock"

  tasks:
    - name: Validate Jenkins deployment variables
      ansible.builtin.assert:
        that:
          - image_repo is defined
          - image_tag is defined
          - source_commit is defined
          - namespace is defined
          - deployment_name is defined
          - container_name is defined
          - dockerhub_username is defined
          - dockerhub_password is defined
          - image_repo | string | length > 0
          - image_tag | string | length > 0
          - source_commit | string | length == 40
        fail_msg: "Required Jenkins or Docker Hub variables are missing."

    - name: Verify BuildKit service is running
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - buildkit
      changed_when: false

    - name: Create application source directory
      ansible.builtin.file:
        path: "{{ app_source_dir }}"
        state: directory
        mode: "0755"

    - name: Checkout exact approved Git commit on VM1
      ansible.builtin.git:
        repo: "{{ source_repo }}"
        dest: "{{ app_source_dir }}"
        version: "{{ source_commit }}"
        force: true

    - name: Verify application build files exist
      ansible.builtin.stat:
        path: "{{ app_source_dir }}/{{ item }}"
      loop:
        - Dockerfile
        - app.py
        - requirements.txt
      register: build_files

    - name: Validate application build files
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
        fail_msg: "A required application build file is missing."
      loop: "{{ build_files.results }}"

    - name: Build and push Flask image using BuildKit
      become: true
      block:

        - name: Create temporary Docker authentication directory
          ansible.builtin.file:
            path: "{{ docker_auth_dir }}"
            state: directory
            mode: "0700"

        - name: Configure temporary Docker Hub authentication
          ansible.builtin.copy:
            dest: "{{ docker_auth_dir }}/config.json"
            mode: "0600"
            content: |
              {
                "auths": {
                  "https://index.docker.io/v1/": {
                    "auth": "{{ (dockerhub_username ~ ':' ~ dockerhub_password) | b64encode }}"
                  }
                }
              }
          no_log: true

        - name: Build and push approved Flask image
          ansible.builtin.command:
            argv:
              - /usr/local/bin/buildctl
              - --addr
              - "{{ buildkit_socket }}"
              - build
              - --progress
              - plain
              - --frontend
              - dockerfile.v0
              - --local
              - "context={{ app_source_dir }}"
              - --local
              - "dockerfile={{ app_source_dir }}"
              - --opt
              - "platform=linux/arm64"
              - --output
              - "type=image,name={{ image_repo }}:{{ image_tag }},push=true"
          environment:
            DOCKER_CONFIG: "{{ docker_auth_dir }}"

      always:
        - name: Remove temporary Docker Hub credentials
          ansible.builtin.file:
            path: "{{ docker_auth_dir }}"
            state: absent

    - name: Apply ConfigMap
      ansible.builtin.command:
        argv:
          - kubectl
          - apply
          - -f
          - "{{ app_source_dir }}/configmap.yaml"
          - -n
          - "{{ namespace }}"

    - name: Apply Deployment manifest
      ansible.builtin.command:
        argv:
          - kubectl
          - apply
          - -f
          - "{{ app_source_dir }}/deployment.yaml"
          - -n
          - "{{ namespace }}"

    - name: Apply Service manifest
      ansible.builtin.command:
        argv:
          - kubectl
          - apply
          - -f
          - "{{ app_source_dir }}/service.yaml"
          - -n
          - "{{ namespace }}"

    - name: Update Deployment to newly built image
      ansible.builtin.command:
        argv:
          - kubectl
          - set
          - image
          - "deployment/{{ deployment_name }}"
          - "{{ container_name }}={{ image_repo }}:{{ image_tag }}"
          - -n
          - "{{ namespace }}"

    - name: Wait for Deployment rollout
      ansible.builtin.command:
        argv:
          - kubectl
          - rollout
          - status
          - "deployment/{{ deployment_name }}"
          - -n
          - "{{ namespace }}"
          - --timeout=300s

    - name: Display release deployment details
      ansible.builtin.debug:
        msg:
          - "Deployment: {{ deployment_name }}"
          - "Namespace: {{ namespace }}"
          - "Image: {{ image_repo }}:{{ image_tag }}"
          - "Approved Git ref: {{ release_ref | default('not supplied') }}"
          - "Source commit: {{ source_commit }}"
          - "Release request: {{ release_request_id | default('not supplied') }}"

    - name: Remove temporary application source
      ansible.builtin.file:
        path: "{{ app_source_dir }}"
        state: absent
