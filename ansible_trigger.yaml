
---
- name: Build and deploy approved Flask release
  hosts: vm1
  become: true
  gather_facts: false

  vars:
    source_repo: "https://github.com/NTAGS/flask-k8s-project.git"
    app_source_dir: "/tmp/flask-app-cicd"
    docker_auth_dir: "/run/flask-buildkit-auth"
    buildkit_socket: "unix:///run/buildkit/buildkitd.sock"

    manifest_files:
      - configmap.yaml
      - deployment.yaml
      - service.yaml

  tasks:
    - name: Validate release variables
      ansible.builtin.assert:
        that:
          - image_repo is defined
          - image_tag is defined
          - source_commit is defined
          - source_commit | length == 40
          - dockerhub_username is defined
          - dockerhub_password is defined
          - namespace is defined
          - deployment_name is defined
          - container_name is defined
        fail_msg: "Required Jenkins/AWX release variables are missing."

    - name: Verify BuildKit service
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - buildkit
      changed_when: false

    - name: Checkout exact approved source commit on VM1
      ansible.builtin.git:
        repo: "{{ source_repo }}"
        dest: "{{ app_source_dir }}"
        version: "{{ source_commit }}"
        force: true

    - name: Verify application build files
      ansible.builtin.stat:
        path: "{{ app_source_dir }}/{{ item }}"
      loop:
        - Dockerfile
        - app.py
        - requirements.txt
      register: build_files

    - name: Fail if application build files are missing
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: "Required application build file is missing."
      loop: "{{ build_files.results }}"

    - name: Create temporary Docker authentication directory
      ansible.builtin.file:
        path: "{{ docker_auth_dir }}"
        state: directory
        mode: "0700"

    - name: Configure Docker Hub authentication for BuildKit
      ansible.builtin.copy:
        dest: "{{ docker_auth_dir }}/config.json"
        mode: "0600"
        content: |
          {
            "auths": {
              "https://index.docker.io/v1/": {
                "auth": "{{ (dockerhub_username ~ ':' ~ dockerhub_password) | b64encode }}"
              }
            }
          }
      no_log: true

    - name: Build and push approved application image
      ansible.builtin.command:
        argv:
          - /usr/local/bin/buildctl
          - --addr
          - "{{ buildkit_socket }}"
          - build
          - --progress
          - plain
          - --frontend
          - dockerfile.v0
          - --local
          - "context={{ app_source_dir }}"
          - --local
          - "dockerfile={{ app_source_dir }}"
          - --opt
          - "platform=linux/arm64"
          - --output
          - "type=image,name={{ image_repo }}:{{ image_tag }},push=true"
      environment:
        DOCKER_CONFIG: "{{ docker_auth_dir }}"

    - name: Apply Kubernetes manifests
      ansible.builtin.command:
        argv:
          - kubectl
          - apply
          - -f
          - "{{ app_source_dir }}/{{ item }}"
          - -n
          - "{{ namespace }}"
      loop: "{{ manifest_files }}"

    - name: Update Deployment to the new image
      ansible.builtin.command:
        argv:
          - kubectl
          - set
          - image
          - "deployment/{{ deployment_name }}"
          - "{{ container_name }}={{ image_repo }}:{{ image_tag }}"
          - -n
          - "{{ namespace }}"

    - name: Wait for Deployment rollout
      ansible.builtin.command:
        argv:
          - kubectl
          - rollout
          - status
          - "deployment/{{ deployment_name }}"
          - -n
          - "{{ namespace }}"
          - --timeout=300s

    - name: Display release details
      ansible.builtin.debug:
        msg:
          - "Image: {{ image_repo }}:{{ image_tag }}"
          - "Source commit: {{ source_commit }}"
          - "Namespace: {{ namespace }}"
          - "Release request: {{ release_request_id | default('not supplied') }}"
